# cargo-about: the licences Shotpile's Rust dependencies may use. The release
# workflow fails if a dependency brings in anything else, so a new licence is
# a decision, not an accident.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
]
targets = ["x86_64-pc-windows-msvc"]
# Shotpile itself (publish = false) is not a third party.
private = { ignore = true }
