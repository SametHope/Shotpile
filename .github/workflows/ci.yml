name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (logic + GUI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:logic
      # Drives the real app in the runner's Chrome against the fake backend.
      - run: npm run test:gui

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A cold Windows build takes about 15 minutes. A hung step (an apt mirror
    # once stalled for over an hour) fails here instead of running on.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows is the shipping target; Linux is where most contributors
        # and agents run the suite.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies for Tauri
        if: runner.os == 'Linux'
        working-directory: .
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The e2e tests send files they created themselves to the runner's real
      # Recycle Bin / trash, which is exactly what they are meant to prove.
      - run: cargo test
