<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Screenshot Sifter — GUI smoke</title>
  <link rel="stylesheet" href="../src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="hwrap">
        <button id="btn-back" class="btn ghost sm" hidden aria-label="Geri">&#8592; Geri</button>
        <div class="brand"><span class="logo">S</span> Screenshot Sifter</div>
        <div class="spacer"></div>
        <span id="scanned-note" class="hint"></span>
        <button id="btn-scan" class="btn" title="Klasörü yeniden tara">Yeniden tara</button>
        <button id="btn-folder" class="btn">Klasör ekle</button>
        <button id="btn-staged" class="btn danger" hidden>Silinecekler</button>
      </div>
    </header>
    <main id="main"><div class="wrap" id="view"></div></main>
    <div class="footbar" id="footbar" hidden>
      <div class="wrap">
        <span class="staged-count"><b id="staged-n">0</b> dosya silinmeyi bekliyor &mdash; dosyalar h&acirc;l&acirc; diskte</span>
        <div class="spacer"></div>
        <button id="btn-undo" class="btn" title="Ctrl+Z">Geri al</button>
        <button id="btn-commit" class="btn danger">Geri dönüşüm kutusuna taşı</button>
      </div>
    </div>
  </div>
  <div class="backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><div class="hwrap"><div class="brand" id="modal-title">Onay</div></div></header>
      <div class="body" id="modal-body"></div>
      <div class="foot" id="modal-foot"></div>
    </div>
  </div>
  <div id="toast"><span class="msg"></span><button class="btn ghost sm" hidden>Geri al</button></div>

  <script>
  // Fake of the Rust command surface, faithful to src-tauri/src/{db,commands}.rs.
  // Root A: 3 PNGs in 2026-09 + 1 unviewable HEIC in 2026-08.
  // Root B: 2 PNGs in 2026-08, used to prove staged counts are global.
  const LOG = [];
  const FAILS = [];
  let nextId = 1;
  const shots = new Map();
  // Test hooks for the two edge cases the GUI harness can reach but the logic
  // tests cannot: a counter-refresh failure after a successful write, and an
  // undo that belongs to a different queue.
  let failNextSummary = false;
  let undoOutOfScope = false;

  function addShot(rootId, name, ext, takenMs, viewable) {
    const id = nextId++;
    shots.set(id, {
      id, path: "C:/" + rootId + "/" + name, root_id: rootId, name, ext,
      size: 120000 + id, taken_ms: takenMs, created_ms: null, modified_ms: null,
      date_source: "filename", status: "pending", decided_ms: null,
      missing: false, viewable,
    });
    return id;
  }

  const A = 1, B = 2;
  const roots = [
    { id: A, path: "C:/shots-a", last_scan_ms: 1757900000000 },
    { id: B, path: "C:/shots-b", last_scan_ms: 1757900000000 },
  ];
  const sept = Date.UTC(2026, 8, 14);
  const aug = Date.UTC(2026, 7, 19);
  // Deliberately seeded out of id order so the taken_ms sort is exercised.
  addShot(A, "Screenshot 2026-09-14 21-15-41.png", "png", sept + 2000, true);
  addShot(A, "Screenshot 2026-09-02 09-03-11.png", "png", sept - 86400000, true);
  addShot(A, "Screenshot 2026-09-14 21-14-05.png", "png", sept + 1000, true);
  addShot(A, "IMG_20260816_120000.heic", "heic", aug, false);
  addShot(B, "Screenshot 2026-08-19 18-22-30.png", "png", aug + 1000, true);
  addShot(B, "Screenshot 2026-08-19 18-24-02.png", "png", aug + 2000, true);

  // The month key the backend produces: local-time year-month.
  function monthKey(ms) {
    const l = new Date(ms + (-new Date().getTimezoneOffset() * 60000));
    return l.getUTCFullYear() + "-" + String(l.getUTCMonth() + 1).padStart(2, "0");
  }
  const byRoot = (id) => [...shots.values()].filter((s) => s.root_id === id);
  const count = (list, st) => list.filter((s) => s.status === st).length;

  const handlers = {
    app_info: () => ({ data_dir: "x", db_path: "y", schema_version: 1, app_version: "1.0.0", image_exts: ["png"], unviewable_exts: ["heic"] }),
    list_roots: () => roots.map((r) => {
      const mine = byRoot(r.id);
      return { ...r, total: mine.length, pending: count(mine, "pending"), kept: count(mine, "kept"), deleted: count(mine, "deleted"), skipped: count(mine, "skipped"), staged: count(mine, "staged"), missing: 0 };
    }),
    summary: (a) => {
      if (failNextSummary) {
        failNextSummary = false;
        throw new Error("simulated summary failure");
      }
      const mine = a.rootId == null ? [...shots.values()] : byRoot(a.rootId);
      return {
        total: mine.length, pending: count(mine, "pending"),
        staged: count(mine, "staged"),
        // Global, because staged_list and commit_deletes ignore the root filter.
        staged_all: [...shots.values()].filter((s) => s.status === "staged").length,
        kept: count(mine, "kept"), deleted: count(mine, "deleted"),
        skipped: count(mine, "skipped"), missing: 0,
        bytes_pending: 0, bytes_total: 0,
        months: new Set(mine.map((s) => monthKey(s.taken_ms))).size,
      };
    },
    months: (a) => {
      const mine = a.rootId == null ? [...shots.values()] : byRoot(a.rootId);
      const by = new Map();
      for (const s of mine) {
        const k = monthKey(s.taken_ms);
        if (!by.has(k)) by.set(k, []);
        by.get(k).push(s);
      }
      return [...by.entries()].sort((x, y) => y[0].localeCompare(x[0])).map(([month, list]) => ({
        month, total: list.length, reviewed: list.length - count(list, "pending"),
        kept: count(list, "kept"), deleted: count(list, "deleted"),
        skipped: count(list, "skipped"), staged: count(list, "staged"),
        remaining: count(list, "pending"),
      }));
    },
    month_thumbs: (a) => {
      const mine = a.rootId == null ? [...shots.values()] : byRoot(a.rootId);
      const by = new Map();
      for (const s of mine) {
        const k = monthKey(s.taken_ms);
        if (!by.has(k)) by.set(k, []);
        if (by.get(k).length < (a.limit || 5)) by.get(k).push(s.path);
      }
      return [...by.entries()].sort((x, y) => y[0].localeCompare(x[0])).map(([month, paths]) => ({ month, paths }));
    },
    queue_ids: (a) => {
      let out = a.rootId == null ? [...shots.values()] : byRoot(a.rootId);
      if (a.scope === "month") out = out.filter((s) => monthKey(s.taken_ms) === a.month);
      else if (a.scope === "staged") out = out.filter((s) => s.status === "staged");
      else if (a.scope === "skipped") out = out.filter((s) => s.status === "skipped");
      else out = out.filter((s) => s.status === "pending");
      out.sort((x, y) => x.taken_ms - y.taken_ms);
      return out.map((s) => s.id);
    },
    items: (a) => a.ids.map((id) => shots.get(id)).filter(Boolean),
    // Mirrors commands::decide — "keep"/"skip" map to the stored status
    // names, which are not the same as the gesture kind.
    decide: (a) => {
      if (FAILS.__failNextDecide) throw new Error("simulated write failure");
      const s = shots.get(a.id);
      if (!s) throw new Error("no such id " + a.id);
      const status = { keep: "kept", skip: "skipped", delete: "staged" }[a.kind];
      if (!status) throw new Error("gecersiz karar: " + a.kind);
      s.status = status;
      s.decided_ms = Date.UTC(2026, 8, 30);
      LOG.push("decide:" + a.kind + ":" + s.name);
      return s;
    },
    undo_last: () => {
      // Simulate the session-wide undo stack returning an id from another root,
      // which is not part of the queue currently on screen.
      if (undoOutOfScope) {
        undoOutOfScope = false;
        const other = [...shots.values()].find((s) => s.root_id === B);
        if (other) {
          other.status = "pending";
          other.decided_ms = null;
          LOG.push("undo:out-of-scope:" + other.name);
          return other;
        }
      }
      let last = null;
      for (const s of shots.values()) if (s.decided_ms) last = s;
      if (!last) return null;
      last.status = "pending";
      last.decided_ms = null;
      LOG.push("undo:" + last.name);
      return last;
    },
    unstage: (a) => { const s = shots.get(a.id); s.status = "pending"; return s; },
    staged_list: () => [...shots.values()].filter((s) => s.status === "staged"),
    commit_deletes: () => {
      const staged = [...shots.values()].filter((s) => s.status === "staged");
      staged.forEach((s) => { s.status = "deleted"; });
      LOG.push("commit:" + staged.length);
      return { deleted: staged.length, failed: [], still_staged: 0 };
    },
    // Mirrors the real command: scanning is what adds the root to the database.
    scan_root: (a) => {
      if (!roots.some((r) => r.path === a.path)) {
        roots.push({ id: roots.length + 1, path: a.path, last_scan_ms: 1757900000000 });
      }
      LOG.push("scan:" + a.path);
      return { root: a.path, found: 4, added: 4, refreshed: 0, skipped_other: 2, unreadable: 0, unviewable: 1, missing: 0, total_in_root: 4, elapsed_ms: 12 };
    },
    pick_folder: () => "C:/shots-a",
    open_devtools: () => { LOG.push("devtools"); return undefined; },
    log_read: () => "fake log line",
  };

  window.__FAILS = FAILS;
  window.__LOG = LOG;
  window.__shots = shots;
  window.addEventListener("error", (e) => FAILS.push("window error: " + e.message));
  window.addEventListener("unhandledrejection", (e) => FAILS.push("unhandled rejection: " + ((e.reason && e.reason.message) || e.reason)));

  window.__TAURI__ = {
    core: {
      // A large generated image, so the card layout is exercised with a
      // real-sized photo rather than a 1x1 GIF.
      convertFileSrc: (p) => {
        const c = document.createElement("canvas");
        c.width = 2000;
        c.height = 1500;
        const ctx = c.getContext("2d");
        const g = ctx.createLinearGradient(0, 0, 2000, 1500);
        g.addColorStop(0, "#3b82f6");
        g.addColorStop(1, "#1d4ed8");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 2000, 1500);
        ctx.fillStyle = "rgba(255,255,255,.85)";
        ctx.font = "90px sans-serif";
        ctx.fillText("TEST", 820, 820);
        return c.toDataURL("image/png");
      },
      invoke: async (cmd, args = {}) => {
        LOG.push("invoke:" + cmd);
        const h = handlers[cmd];
        if (!h) throw new Error("unmocked command: " + cmd);
        return h(args);
      },
    },
  };

  // ---- helpers the Node-side driver calls through CDP ----
  const $ = (s) => document.querySelector(s);
  const viewText = () => $("#view").textContent.replace(/\s+/g, " ").trim();
  window.__nodeSeq = 0;

window.__probe = {
    viewText,
    status: (name) => {
      const s = [...shots.values()].find((x) => x.name === name);
      return s ? s.status : null;
    },
    // Read the top card's own filename node (the deck has several .card nodes).
    cardName: () => {
      const n = $(".deck-top .fname");
      return n ? n.textContent.trim() : null;
    },
    // "1 / 3" comes from the last span of the progress row.
    progress: () => {
      const row = $(".progress-row");
      if (!row) return null;
      // The zoom readout also lives in this row, so skip it and take the
      // "n / n" counter specifically.
      const spans = [...row.querySelectorAll(":scope > span")].filter((s) => !s.classList.contains("zoom-readout"));
      const counter = spans.find((s) => /^\d+\s*\/\s*\d+$/.test(s.textContent.trim()));
      return counter ? counter.textContent.trim() : null;
    },
    monthRows: () => [...document.querySelectorAll(".month")].map((n) => n.textContent.replace(/\s+/g, " ").trim()),
    stagedCount: () => $("#staged-n").textContent,
    stagedBtn: () => $("#btn-staged").textContent,
    footbarOn: () => $("#footbar").classList.contains("on"),
    modalHidden: () => $("#modal").hidden,
    focusedLabel: () => {
      const a = document.activeElement;
      return a && a !== document.body ? a.textContent.trim() : null;
    },
    toastText: () => $("#toast").textContent.trim(),
    stagedRowNames: () => [...document.querySelectorAll(".staged-row .n")].map((n) => n.textContent.trim()),
    hasCard: () => !!$(".card"),
    hasImg: () => !!$(".card img"),
    clickFirstMonth: () => { $(".month").click(); },
    backToMonths: () => { $("#btn-back").click(); },
    clickStagedBtn: () => { $("#btn-staged").click(); },
    clickCommit: () => { $("#btn-commit").click(); },
    clickConfirmInModal: () => {
      const btn = [...document.querySelectorAll("#modal-foot button")].find((b) => /move/i.test(b.textContent));
      if (btn) btn.click();
      return !!btn;
    },
    setFailNextDecide: (v) => { FAILS.__failNextDecide = v; },
    setFailNextSummary: (v) => { failNextSummary = v; },
    setUndoOutOfScope: (v) => { undoOutOfScope = v; },
    logFilter: (prefix) => LOG.filter((l) => l.startsWith(prefix)),
    devtoolsCalled: () => LOG.includes("devtools"),
    logModalText: () => { const n = $(".logview"); return n ? n.textContent.trim() : null; },
    reset: () => { LOG.length = 0; },
    resetShots: () => {
      for (const s of shots.values()) {
        s.status = "pending";
        s.decided_ms = null;
      }
    },
    addFolder: () => window.__sifterTest.addFolder(),
    resetToSetup: () => window.__sifterTest.resetToSetup(),
    // Deck / viewer / thumbnail probes.
    deckCount: () => document.querySelectorAll(".deck .card").length,
    deckTopName: () => {
      const top = document.querySelector(".deck-top .fname");
      return top ? top.textContent.trim() : null;
    },
    cardRect: () => {
      const c = document.querySelector(".deck .deck-top");
      if (!c) return null;
      const r = c.getBoundingClientRect();
      return { w: Math.round(r.width), h: Math.round(r.height) };
    },
    // --- card geometry: is the image fully visible, or does the info bar
    // cover it? ---
    cardGeometry: () => {
      const card = document.querySelector("#card");
      const img = card?.querySelector(".imgwrap img");
      const wrap = card?.querySelector(".imgwrap");
      const foot = card?.querySelector(".foot");
      if (!card || !img || !wrap || !foot) return null;
      const c = card.getBoundingClientRect();
      const i = img.getBoundingClientRect();
      const w = wrap.getBoundingClientRect();
      const f = foot.getBoundingClientRect();
      const fname = card.querySelector(".fname");
      const r = (x) => ({ top: Math.round(x.top), bottom: Math.round(x.bottom), left: Math.round(x.left), right: Math.round(x.right), h: Math.round(x.height), w: Math.round(x.width) });
      const cs = getComputedStyle(foot);
      const alpha = (() => {
        const m = /rgba?\([^)]*?,\s*([\d.]+)\s*\)$/.exec(cs.backgroundColor);
        return m ? Number(m[1]) : 1;
      })();
      return {
        card: r(c), img: r(i), wrap: r(w), foot: r(f),
        // Height the photo actually gets, and the overlay's share of it.
        imgBoxH: Math.round(i.height), footShare: +(f.height / c.height).toFixed(3),
        footPosition: cs.position, footInFlow: cs.position === "static", footAlpha: alpha,
        // Does the image spill past the frame it is supposed to sit in?
        imgOverflowsWrap: +(Math.max(0, i.bottom - w.bottom) + Math.max(0, i.top - w.top)).toFixed(1),
        imgOverflowsCard: +(Math.max(0, i.bottom - c.bottom)).toFixed(1),
        fnameLines: fname ? Math.round(fname.getBoundingClientRect().height / 20) : 0,
      };
    },
    imgNatural: () => {
      const img = document.querySelector("#card .imgwrap img");
      return img ? { w: img.naturalWidth, h: img.naturalHeight } : null;
    },
    monthThumbCount: () => document.querySelectorAll(".month .thumbs img").length,
    viewerOpen: () => !!document.getElementById("viewer"),
    viewerZoom: () => {
      const n = document.querySelector(".viewer-zoom");
      return n ? n.textContent.trim() : null;
    },
    viewerName: () => {
      const n = document.querySelector(".viewer-name");
      return n ? n.textContent.trim() : null;
    },
    openViewer: () => window.__sifterTest.openViewer(),
    closeViewer: () => window.__sifterTest.closeViewer(),
    clickCard: () => {
      const c = document.querySelector(".deck .deck-top");
      if (!c) return false;
      // A real click is always preceded by a pointerdown, which is what clears
      // the "this was a drag" flag. Without it a preceding synthetic drag would
      // suppress the viewer.
      const r = c.getBoundingClientRect();
      const x = r.left + r.width / 2, y = r.top + r.height / 2;
      c.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, clientX: x, clientY: y, button: 0, pointerId: 9, isPrimary: true }));
      c.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, clientX: x, clientY: y, button: 0, pointerId: 9, isPrimary: true }));
      c.click();
      return true;
    },
    filmCount: () => document.querySelectorAll(".film-item").length,
    filmCurrent: () => [...document.querySelectorAll(".film-item")].findIndex((el) => el.classList.contains("current")),
    clickFilm: (i) => {
      const items = document.querySelectorAll(".film-item");
      if (items[i]) { items[i].click(); return true; }
      return false;
    },

    // --- drag/tint/scale feedback ---
    dragStart: () => {
      const c = document.querySelector("#card");
      const r = c.getBoundingClientRect();
      window.__probe._drag = { el: c, x: r.left + r.width / 2, y: r.top + r.height / 2 };
      c.dispatchEvent(new PointerEvent("pointerdown", {
        bubbles: true, clientX: window.__probe._drag.x, clientY: window.__probe._drag.y, button: 0, pointerId: 7, isPrimary: true,
      }));
      return true;
    },
    dragTo: (dx, dy) => {
      const d = window.__probe._drag;
      document.getElementById("stage").dispatchEvent(new PointerEvent("pointermove", {
        bubbles: true, clientX: d.x + dx, clientY: d.y + dy, button: 0, pointerId: 7, isPrimary: true,
      }));
      return true;
    },
    dragEnd: () => {
      const d = window.__probe._drag;
      document.getElementById("stage").dispatchEvent(new PointerEvent("pointerup", {
        bubbles: true, clientX: d.x, clientY: d.y, button: 0, pointerId: 7, isPrimary: true,
      }));
      window.__probe._drag = null;
      return true;
    },
    tintOpacity: () => {
      const t = document.querySelector("#card .tint");
      return t ? Number(t.style.opacity || 0) : null;
    },
    cardScale: () => {
      const c = document.querySelector("#card");
      const m = /scale\(([\d.]+)\)/.exec(c.style.transform || "");
      return m ? Number(m[1]) : 1;
    },
stampOpacity: (dir) => {
      const s = document.querySelector(`#card .stamp.${dir}`);
      return s ? s.style.opacity : null;
    },
    // --- info bar + deck, during a drag ---
    footBackground: () => {
      const f = document.querySelector("#card .foot");
      return f ? f.style.background || "" : null;
    },
    footBackgroundComputed: () => {
      const f = document.querySelector("#card .foot");
      return f ? getComputedStyle(f).backgroundImage : null;
    },
    cardScale: () => {
      const c = document.querySelector("#card");
      const m = /scale\(([\d.]+)\)/.exec(c?.style.transform || "");
      return m ? Number(m[1]) : 1;
    },
    deck1Transform: () => document.querySelector(".deck .deck-1")?.style.transform || "",
    deck1Dy: () => {
      const n = document.querySelector(".deck .deck-1");
      if (!n) return null;
      const m = /translateY\((-?[\d.]+)px\)/.exec(n.style.transform || "");
      return m ? Number(m[1]) : 0;
    },
    deckStacking: () => !!document.querySelector(".deck.stacking"),
    deck1ComputedTransition: () => {
      const n = document.querySelector(".deck .deck-1");
      return n ? getComputedStyle(n).transitionDuration : null;
    },
    // --- smooth advance: node identity is what proves it ---
    topNodeId: () => {
      const n = document.querySelector(".deck .deck-top");
      return n ? (n.__probeId || (n.__probeId = `n${++window.__nodeSeq}`)) : null;
    },
    topImgSrc: () => document.querySelector("#card .imgwrap img")?.getAttribute("src") || null,
    topOpacity: () => {
      const n = document.querySelector("#card");
      return n ? getComputedStyle(n).opacity : null;
    },
    topInlineTransform: () => document.querySelector("#card")?.style.transform || "",
    topHasEnterClass: () => !!document.querySelector("#card.enter"),
    topAnimateName: () => {
      const n = document.querySelector("#card");
      return n ? getComputedStyle(n).animationName : "none";
    },
    deckChildCount: () => document.querySelectorAll(".deck .card").length,
    stageIsSame: (mark) => document.querySelector(".deck")?.dataset.probeMark === mark,
    deckInert: () => !!document.querySelector(".deck.inert"),
    markStage: () => {
      const d = document.querySelector(".deck");
      if (!d) return null;
      d.dataset.probeMark = `m${++window.__nodeSeq}`;
      return d.dataset.probeMark;
    },

    // --- card zoom ---
    wheelCard: (dx, dy, up = true) => {
      const w = document.querySelector("#card .imgwrap");
      w.dispatchEvent(new WheelEvent("wheel", {
        bubbles: true, cancelable: true, clientX: dx, clientY: dy, deltaY: up ? -100 : 100, deltaMode: 0,
      }));
      return true;
    },
    resetCardZoom: () => window.__sifterTest.resetCardZoom(),
    cardZoomScale: () => {
      const i = document.querySelector("#card .imgwrap img");
      const m = /scale\(([\d.]+)\)/.exec(i?.style.transform || "");
      return m ? Number(m[1]) : 1;
    },
    cardIsPannable: () => document.querySelector("#card")?.classList.contains("pannable") || false,
    zoomReadout: () => document.querySelector(".zoom-readout")?.textContent || null,
    dateSourceInMeta: () => {
      const metas = [...document.querySelectorAll("#card .fmeta .hint")];
      return metas.map((m) => m.textContent.trim());
    },
    dateTooltip: () => document.querySelector("#card .fmeta span")?.getAttribute("title") || null,

    // --- delete preview grid ---
    openDeleteConfirm: async () => {
      document.getElementById("btn-commit").click();
      await new Promise((r) => setTimeout(r, 60));
      return true;
    },
    delGridCount: () => document.querySelectorAll(".del-cell").length,
    delGridNames: () => [...document.querySelectorAll(".del-cell figcaption")].map((f) => f.textContent.trim()),
    delModalWide: () => document.querySelector("#modal .modal")?.classList.contains("wide") || false,
  };
  </script>
  <script type="module" src="../src/app.js"></script>
</body>
</html>
