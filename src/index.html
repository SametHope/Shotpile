<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Shotpile</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231d4ed8'/%3E%3Cg fill='white' stroke='white' stroke-linecap='round' transform='translate%2812 12%29 scale%28.8%29 translate%28-12 -12.4%29'%3E%3Crect x='3.6' y='7' width='11' height='13.5' rx='2.2' transform='rotate%28-9 9.1 13.75%29' fill='none' stroke-width='1.9' opacity='.55'/%3E%3Cg transform='rotate%2813 14.6 11.2%29'%3E%3Crect x='9.1' y='4.5' width='11' height='13.5' rx='2.2' fill='none' stroke-width='1.9'/%3E%3Ccircle cx='12.6' cy='8.6' r='1.25' stroke='none'/%3E%3Cpath d='M10.4 15.6l3.1-3.2 2.2 2.1 1.4-1.4 2.2 2.2' fill='none' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
  <script src="./boot.js"></script>
</head>
<body data-view="loading">
  <div id="splash" aria-hidden="true">
    <span class="splash-mark"><svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" stroke="currentColor" stroke-linecap="round"><rect x="3.6" y="7" width="11" height="13.5" rx="2.2" transform="rotate(-9 9.1 13.75)" fill="none" stroke-width="1.9" opacity=".55"/><g transform="rotate(13 14.6 11.2)"><rect x="9.1" y="4.5" width="11" height="13.5" rx="2.2" fill="none" stroke-width="1.9"/><circle cx="12.6" cy="8.6" r="1.25" stroke="none"/><path d="M10.4 15.6l3.1-3.2 2.2 2.1 1.4-1.4 2.2 2.2" fill="none" stroke-width="1.6" stroke-linejoin="round"/></g></svg></span>
    <span class="splash-name">Shotpile</span>
  </div>
  <div id="app">
    <header class="topbar">
      <div class="hwrap">
        <button id="btn-back" class="btn ghost sm back" hidden aria-label="Back to the library">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg></span>
          Library
        </button>
        <div class="brand">
          <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="currentColor" stroke-linecap="round"><rect x="3.6" y="7" width="11" height="13.5" rx="2.2" transform="rotate(-9 9.1 13.75)" fill="none" stroke-width="1.9" opacity=".55"/><g transform="rotate(13 14.6 11.2)"><rect x="9.1" y="4.5" width="11" height="13.5" rx="2.2" fill="none" stroke-width="1.9"/><circle cx="12.6" cy="8.6" r="1.25" stroke="none"/><path d="M10.4 15.6l3.1-3.2 2.2 2.1 1.4-1.4 2.2 2.2" fill="none" stroke-width="1.6" stroke-linejoin="round"/></g></svg></span>
          <span class="brand-name">Shotpile</span>
        </div>
        <button id="btn-folder" class="folder-chip" hidden aria-haspopup="menu" aria-expanded="false" title="Switch folder">
          <span class="folder-name" id="folder-name"></span>
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg></span>
        </button>
        <div class="spacer"></div>
        <button id="btn-scan" class="btn ghost" hidden title="Look for new screenshots in this folder">Rescan</button>
        <button id="btn-staged" class="btn pile-btn" hidden title="Screenshots marked for deletion">
          To delete <span class="badge" id="staged-badge">0</span>
        </button>
        <button id="btn-options" class="btn ghost icon" title="Options (Ctrl+,)" aria-label="Options"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></span></button>
        <button id="btn-help" class="btn ghost icon" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
      </div>
    </header>

    <main id="main">
      <div id="view" class="view" aria-live="off"></div>
    </main>

    <div class="footbar" id="footbar">
      <div class="fwrap">
        <span class="staged-count"><b id="staged-n">0 screenshots</b> marked for deletion <span id="staged-size" class="muted"></span> &middot; still on disk</span>
        <div class="spacer"></div>
        <button id="btn-undo" class="btn ghost" title="Undo the last decision (Ctrl+Z)">Undo</button>
        <button id="btn-redo" class="btn ghost" title="Redo what was undone (Ctrl+Y)">Redo</button>
        <button id="btn-commit" class="btn danger solid" title="Review and delete the marked screenshots, moving them to the Recycle Bin">Review and delete</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><h2 id="modal-title">Confirm</h2></div>
      <div class="body" id="modal-body"></div>
      <div class="foot" id="modal-foot"></div>
    </div>
  </div>

  <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"><span class="msg"></span><button class="btn ghost sm" hidden>Undo</button></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
