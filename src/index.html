<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screenshot Sifter</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="hwrap">
        <button id="btn-back" class="btn ghost sm" hidden aria-label="Back">&#8592; Back</button>
        <div class="brand"><span class="logo">S</span> Screenshot Sifter</div>
        <div class="spacer"></div>
        <span id="scanned-note" class="hint"></span>
        <button id="btn-scan" class="btn" title="Rescan the folder">Rescan</button>
        <button id="btn-folder" class="btn">Add Folder</button>
        <button id="btn-staged" class="btn danger" hidden>To Delete</button>
      </div>
    </header>

    <main id="main">
      <div class="wrap" id="view"></div>
    </main>

    <div class="footbar" id="footbar">
      <div class="wrap">
        <span class="staged-count"><b id="staged-n">0</b> files waiting to delete &mdash; still on disk</span>
        <div class="spacer"></div>
        <button id="btn-undo" class="btn" title="Ctrl+Z">Undo</button>
        <button id="btn-commit" class="btn danger">Move to Recycle Bin</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header>
        <div class="hwrap">
          <div class="brand" id="modal-title">Confirm</div>
        </div>
      </header>
      <div class="body" id="modal-body"></div>
      <div class="foot" id="modal-foot"></div>
    </div>
  </div>

  <div id="toast"><span class="msg"></span><button class="btn ghost sm" hidden>Undo</button></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
